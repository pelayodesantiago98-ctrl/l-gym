<!doctype html>
<html lang=es>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width, initial-scale=1'>
<meta name=robots content=noindex>
<meta name=theme-color content='#0f1216'>
<title>L-gym</title>
<link rel=icon href=/img/icono-32.png sizes=32x32>
<link rel=icon href=/img/icono-192.png sizes=192x192>
<link rel=apple-touch-icon href=/img/icono-180.png>
<link rel=stylesheet href=/estilo.css>
<!-- El tema no se aplica aquí: lo marca el servidor en el <html> al servir
     esta página, que es lo único que evita el fogonazo del tema por defecto. -->
</head>
<body>

<header class=barra>
  <span class=marca>
    <img class=marca-icono src=/img/marca.png alt='' width=36 height=36>
    L-gym
  </span>
  <nav class=pestanas role=tablist>
    <button type=button class='pestana activa' role=tab data-vista=hoy>Entreno</button>
    <button type=button class=pestana role=tab data-vista=rutinas>Rutinas</button>
    <button type=button class=pestana role=tab data-vista=progreso>Progreso</button>
  </nav>
  <div class=menu-usuario>
    <button type=button class=avatar-boton id=boton-menu
            aria-haspopup=menu aria-expanded=false aria-controls=menu-usuario
            aria-label='Abrir el menú'>
      <img class=avatar src='https://lepayimio.es/perfil/foto' alt='' width=32 height=32>
    </button>
    <div class=menu id=menu-usuario role=menu hidden>
      <span class=menu-quien><b id=menu-nombre>…</b><small>L-gym</small></span>

      <!-- Enlace externo de verdad: sale del subdominio. -->
      <a class=menu-opcion role=menuitem href='https://lepayimio.es/'>Inicio de lepayimio</a>

      <hr class=menu-linea>
      <div class=menu-vistas>
        <button type=button class=menu-opcion role=menuitem data-vista=hoy>Entreno</button>
        <button type=button class=menu-opcion role=menuitem data-vista=rutinas>Rutinas</button>
        <button type=button class=menu-opcion role=menuitem data-vista=progreso>Progreso</button>
      </div>

      <hr class=menu-linea>
      <!-- El tema, plegado. Suelto ocupaba tres de las seis entradas del menú
           y lo que se usa a diario son las vistas, no cambiar de color. -->
      <button type=button class='menu-opcion menu-desplegar' id=abrir-temas
              aria-expanded=false aria-controls=submenu-temas>
        <span class=menu-etiqueta>Tema</span>
        <span class="tema-muestra tema-mini oscuro" id="tema-actual" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg></span>
        <svg class=menu-flecha viewBox='0 0 24 24' aria-hidden=true><path d='M8.6 5.6 15 12l-6.4 6.4-1.4-1.4L12.2 12 7.2 7z'/></svg>
      </button>

      <hr class=menu-linea>
      <!-- Formulario y no fetch: el portal responde con una redirección a su
           pantalla de entrada, y así el navegador la sigue solo. -->
      <form method=post action=/salir class=menu-forma>
        <button type=submit class=menu-opcion role=menuitem>Desconectarse</button>
      </form>
    </div>
  </div>
</header>

<main id=principal>

  <!-- ------------------------------------------------------------ ENTRENO -->
  <section class=vista id=vista-hoy>
    <div class=cabecera-dia>
      <p class=campo-linea>
        <label for=fecha>Día</label>
        <input type=date id=fecha>
      </p>
      <p class=campo-linea>
        <label for=grupo>Grupo muscular</label>
        <select id=grupo></select>
      </p>
    </div>

    <p class=aviso id=aviso-hoy role=status></p>

    <div id=entreno hidden>
      <section class=bloque>
        <h2 class=titulo-bloque>Calentamiento</h2>
        <ul class=lista id=lista-calentamiento></ul>
      </section>

      <section class=bloque>
        <h2 class=titulo-bloque>Ejercicios</h2>
        <ul class=lista id=lista-ejercicios></ul>
      </section>

      <section class=bloque>
        <h2 class=titulo-bloque>Notas del día</h2>
        <textarea id=notas rows=3 maxlength=1000 placeholder='Sensaciones, molestias, lo que quieras acordarte la próxima vez'></textarea>
      </section>

      <section class='bloque cierre' id=bloque-cierre>
        <p class=resumen id=resumen-cierre></p>
        <button type=button class='boton boton-grande' id=guardar-entreno>Guardar entreno</button>
        <p class=aviso id=aviso-cierre role=status></p>
      </section>
    </div>
  </section>

  <!-- ------------------------------------------------------------ RUTINAS -->
  <section class='vista oculta' id=vista-rutinas>
    <form class=fila-anadir id=form-grupo>
      <label class=oculto for=nuevo-grupo>Nuevo grupo muscular</label>
      <input id=nuevo-grupo placeholder='Nuevo grupo: pecho, espalda, pierna…' maxlength=60 required>
      <button type=submit class=boton>Añadir grupo</button>
    </form>
    <div class=fila-existentes>
      <button type=button class=boton-lino id=boton-existentes
              aria-expanded=false aria-controls=panel-existentes>Rutinas existentes</button>
      <span class=nota id=nota-existentes>Mira lo que han montado los demás y cópiatelo.</span>
    </div>
    <div class=panel-existentes id=panel-existentes hidden></div>
    <div id=editor></div>
  </section>

  <!-- ----------------------------------------------------------- PROGRESO -->
  <section class='vista oculta' id=vista-progreso>
    <div class=tarjetas id=tarjetas></div>

    <section class=bloque>
      <h2 class=titulo-bloque>Progreso de un ejercicio</h2>
      <p class=campo-linea>
        <label for=ejercicio-grafica>Ejercicio</label>
        <select id=ejercicio-grafica></select>
      </p>
      <div id=graficas></div>
    </section>

    <section class=bloque>
      <h2 class=titulo-bloque>Marcas personales</h2>
      <div class=tabla-envoltura><table class=tabla id=tabla-records></table></div>
    </section>

    <section class=bloque>
      <h2 class=titulo-bloque>Últimos entrenos</h2>
      <div class=tabla-envoltura><table class=tabla id=tabla-historial></table></div>
    </section>
  </section>

</main>

<!-- Ventana del tema. Va al final del cuerpo y no dentro del menú: dentro
     heredaría su recorte y su posición, y una ventana centrada no puede colgar
     de algo que se cierra al pulsar fuera. -->
<div class="tema-velo" id="tema-velo" hidden>
  <div class="tema-ventana" role="dialog" aria-modal="true" aria-labelledby="tema-titulo">
    <div class="tema-barra">
      <b id="tema-titulo">Tema</b>
      <button type="button" class="tema-cerrar" data-cierra-tema aria-label="Cerrar">Hecho</button>
    </div>
      <div class="submenu" id="submenu-temas" role="group" aria-label="Tema" hidden>
        <button type="button" class="menu-tema" role="menuitemradio" data-tema="oscuro">
          <span class="tema-muestra oscuro">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
          </span>
          <span class="tema-nombre">Oscuro</span>
          <span class="tema-tic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
        </button>
        <button type="button" class="menu-tema" role="menuitemradio" data-tema="crystal">
          <span class="tema-muestra crystal">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm0 12.2l7.1-3.95L21 12l-9 5-9-5 1.9-1.05L12 15.2z"/></svg>
          </span>
          <span class="tema-nombre">Crystal</span>
          <span class="tema-tic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
        </button>
        <button type="button" class="menu-tema" role="menuitemradio" data-tema="dark-crystal">
          <span class="tema-muestra dark-crystal">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm0 12.2l7.1-3.95L21 12l-9 5-9-5 1.9-1.05L12 15.2z"/></svg>
          </span>
          <span class="tema-nombre">Dark Crystal</span>
          <span class="tema-tic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
        </button>
      </div>
  </div>
</div>

<script src=/guion.js></script>
</body>
</html>
