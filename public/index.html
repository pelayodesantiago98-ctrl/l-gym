<!doctype html>
<html lang=es>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width, initial-scale=1'>
<meta name=robots content=noindex>
<meta name=theme-color content='#0f1216'>
<title>L-gym</title>
<link rel=icon href=/img/icono-32.png sizes=32x32>
<link rel=icon href=/img/icono-192.png sizes=192x192>
<link rel=apple-touch-icon href=/img/icono-180.png>
<link rel=stylesheet href=/estilo.css?v=1787399311>
<!-- La capa de acabado: va DESPUES de la hoja de la casa, que es lo que le
     permite anadir sin redefinir. -->
<link rel=stylesheet href=/mejoras.css?v=1787399315>
<!-- El tema no se aplica aquí: lo marca el servidor en el <html> al servir
     esta página, que es lo único que evita el fogonazo del tema por defecto. -->
</head>
<body>

<header class=barra>
  <span class=marca>
    <img class=marca-icono src=/img/marca.png alt='' width=36 height=36>
    L-gym
  </span>
  <div class=menu-usuario>
    <button type=button class=avatar-boton id=boton-menu
            aria-haspopup=menu aria-expanded=false aria-controls=menu-usuario
            aria-label='Abrir el menú'>
      <img class=avatar src='https://lepayimio.es/perfil/foto' alt='' width=32 height=32>
    </button>
    <div class=menu id=menu-usuario role=menu hidden>
      <span class=menu-quien><b id=menu-nombre>…</b><small>L-gym</small></span>

      <!-- Enlace externo de verdad: sale del subdominio. -->
      <a class=menu-opcion role=menuitem href='https://lepayimio.es/'><svg class="menu-icono ico ico-inicio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-tejado" d="M5 12l-2 0l9 -9l9 9l-2 0"/><path class="ico-casa" d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path class="ico-puerta" d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>Inicio de lepayimio</a>

      <hr class=menu-linea>
      <div class=menu-vistas>
        <button type=button class=menu-opcion role=menuitem data-vista=hoy><svg class="menu-icono ico ico-pesa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-disco ico-disco-izq" d="M4 10v4"/><path class="ico-disco ico-disco-izq" d="M7 7v10"/><path class="ico-barra-pesa" d="M7 12h10"/><path class="ico-disco ico-disco-der" d="M17 7v10"/><path class="ico-disco ico-disco-der" d="M20 10v4"/></svg>Entreno</button>
        <button type=button class=menu-opcion role=menuitem data-vista=rutinas><svg class="menu-icono ico ico-lista" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-renglon ico-renglon-1" d="M9 6l11 0"/><path class="ico-renglon ico-renglon-2" d="M9 12l11 0"/><path class="ico-renglon ico-renglon-3" d="M9 18l11 0"/><g class="ico-puntos"><path d="M5 6l0 .01"/><path d="M5 12l0 .01"/><path d="M5 18l0 .01"/></g></svg>Rutinas</button>
        <button type=button class=menu-opcion role=menuitem data-vista=progreso><svg class="menu-icono ico ico-grafica" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-eje" d="M4 19l16 0"/><path class="ico-curva" d="M4 15l4 -6l4 2l4 -5l4 4"/></svg>Progreso</button>
        <button type=button class=menu-opcion role=menuitem data-vista=registro><svg class="menu-icono ico ico-calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path class="ico-clavija" d="M16 3v4"/><path class="ico-clavija" d="M8 3v4"/><path class="ico-raya" d="M4 11h16"/></svg>Registro</button>
      </div>

      <hr class=menu-linea>
      <!-- El tema, plegado. Suelto ocupaba tres de las seis entradas del menú
           y lo que se usa a diario son las vistas, no cambiar de color. -->
      <button type=button class='menu-opcion menu-desplegar' id=abrir-temas
              aria-expanded=false aria-controls=submenu-temas>
        <span class=menu-etiqueta>Tema</span>
        <span class="tema-muestra tema-mini oscuro" id="tema-actual" aria-hidden="true"><svg class="ico ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/></svg></span>
        <svg class="menu-flecha ico ico-flecha-der" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg>
      </button>

      <div class="submenu" id="submenu-temas" role="group" aria-label="Tema" hidden>
        <button type="button" class="menu-tema" role="menuitemradio" data-tema="oscuro">
          <span class="tema-muestra oscuro">
            <svg class="ico ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/></svg>
          </span>
          <span class="tema-nombre">Oscuro</span>
          <span class="tema-tic"><svg class="ico ico-tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-marca" d="M5 12l5 5l10 -10"/></svg></span>
        </button>
        <button type="button" class="menu-tema" role="menuitemradio" data-tema="crystal">
          <span class="tema-muestra crystal">
            <svg class="ico ico-capas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-capa-alta" d="M12 6l-8 4l8 4l8 -4l-8 -4"/><path class="ico-capa-baja" d="M4 14l8 4l8 -4"/></svg>
          </span>
          <span class="tema-nombre">Crystal</span>
          <span class="tema-tic"><svg class="ico ico-tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-marca" d="M5 12l5 5l10 -10"/></svg></span>
        </button>
        <button type="button" class="menu-tema" role="menuitemradio" data-tema="dark-crystal">
          <span class="tema-muestra dark-crystal">
            <svg class="ico ico-capas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-capa-alta" d="M12 6l-8 4l8 4l8 -4l-8 -4"/><path class="ico-capa-baja" d="M4 14l8 4l8 -4"/></svg>
          </span>
          <span class="tema-nombre">Dark Crystal</span>
          <span class="tema-tic"><svg class="ico ico-tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-marca" d="M5 12l5 5l10 -10"/></svg></span>
        </button>
      </div>

      <hr class=menu-linea>
      <!-- Formulario y no fetch: el portal responde con una redirección a su
           pantalla de entrada, y así el navegador la sigue solo. -->
      <form method=post action=/salir class=menu-forma>
        <button type=submit class=menu-opcion role=menuitem><svg class="menu-icono ico ico-salir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-puerta" d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/><path class="ico-flecha" d="M9 12h12"/><path class="ico-flecha" d="M18 15l3 -3l-3 -3"/></svg>Desconectarse</button>
      </form>
    </div>
  </div>
</header>

<main id=principal>

  <!-- ------------------------------------------------------------ ENTRENO -->
  <section class=vista id=vista-hoy>
    <div class=cabecera-dia>
      <p class=campo-linea>
        <label for=fecha>Día</label>
        <input type=date id=fecha>
      </p>
      <p class=campo-linea>
        <label for=grupo>Grupo muscular</label>
        <select id=grupo></select>
      </p>
    </div>

    <p class=aviso id=aviso-hoy role=status></p>

    <div id=entreno hidden>
      <section class=bloque>
        <h2 class=titulo-bloque>Calentamiento</h2>
        <ul class=lista id=lista-calentamiento></ul>
      </section>

      <section class=bloque>
        <h2 class=titulo-bloque>Ejercicios</h2>
        <ul class=lista id=lista-ejercicios></ul>
      </section>

      <section class=bloque>
        <h2 class=titulo-bloque>Notas del día</h2>
        <textarea id=notas rows=3 maxlength=1000 placeholder='Sensaciones, molestias, lo que quieras acordarte la próxima vez'></textarea>
      </section>

      <section class='bloque cierre' id=bloque-cierre>
        <p class=resumen id=resumen-cierre></p>
        <button type=button class='boton boton-grande' id=guardar-entreno>Guardar entreno</button>
        <p class=aviso id=aviso-cierre role=status></p>
      </section>
    </div>
  </section>

  <!-- ------------------------------------------------------------ RUTINAS -->
  <section class='vista oculta' id=vista-rutinas>
    <form class=fila-anadir id=form-grupo>
      <label class=oculto for=nuevo-grupo>Nuevo grupo muscular</label>
      <input id=nuevo-grupo placeholder='Nuevo grupo: pecho, espalda, pierna…' maxlength=60 required>
      <button type=submit class=boton>Añadir grupo</button>
    </form>
    <div class=fila-existentes>
      <button type=button class=boton-lino id=boton-existentes
              aria-expanded=false aria-controls=panel-existentes>Rutinas existentes</button>
      <span class=nota id=nota-existentes>Mira lo que han montado los demás y cópiatelo.</span>
    </div>
    <div class=panel-existentes id=panel-existentes hidden></div>
    <div id=editor></div>
  </section>

  <!-- ----------------------------------------------------------- PROGRESO -->
  <section class='vista oculta' id=vista-progreso>
    <div class=tarjetas id=tarjetas></div>

    <section class=bloque>
      <h2 class=titulo-bloque>Progreso de un ejercicio</h2>
      <p class=campo-linea>
        <label for=ejercicio-grafica>Ejercicio</label>
        <select id=ejercicio-grafica></select>
      </p>
      <div id=graficas></div>
    </section>

    <section class=bloque>
      <h2 class=titulo-bloque>Marcas personales</h2>
      <div class=tabla-envoltura><table class=tabla id=tabla-records></table></div>
    </section>

    <section class=bloque>
      <h2 class=titulo-bloque>Últimos entrenos</h2>
      <div class=tabla-envoltura><table class=tabla id=tabla-historial></table></div>
    </section>
  </section>

  <!-- ----------------------------------------------------------- REGISTRO -->
  <section class='vista oculta' id=vista-registro>
    <div class=cabecera-dia>
      <p class=campo-linea>
        <label for=reg-desde>Desde</label>
        <input type=date id=reg-desde>
      </p>
      <p class=campo-linea>
        <label for=reg-grupo>Grupo muscular</label>
        <select id=reg-grupo><option value=''>Todos</option></select>
      </p>
      <button type=button class=boton-lino id=reg-limpiar>Quitar filtros</button>
    </div>

    <div class=fila-existentes>
      <button type=button class=boton-lino id=reg-exportar>Exportar datos</button>
      <button type=button class=boton-lino id=reg-importar>Importar</button>
      <input type=file id=reg-fichero accept='.json,.csv' hidden>
      <span class=nota id=reg-nota></span>
    </div>

    <p class=aviso id=aviso-registro role=status></p>
    <div id=reg-dias></div>
    <div id=reg-detalle></div>
  </section>

</main>


<script src=/guion.js></script>
<script src=/mejoras.js defer></script>
</body>
</html>
